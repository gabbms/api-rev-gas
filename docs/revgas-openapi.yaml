                  * `ISENTA_OU_NAO_TRIBUTADA_COM_COBRANCA_ICMS_POR_SUSBSTITUICAO_TRIBUTARIA` - 030 - Isenta ou não tributada e com cobrança do ICMS por substituição tributária
                  * `ISENTA` - 040 - Isenta
                  * `NAO_TRIBUTADA` - 041 - Não tributada
                  * `COM_SUSPENSAO` - 050 - Com suspensão
                  * `COM_DIFERIMENTO` - 051 - Com diferimento
                  * `ICMS_COBRADO_ANTERIORMENTE_POR_SUBSTITUICAO_TRIBUTARIA` - 060 - ICMS cobrado anteriormente por substituição tributária
                  * `REDUCAO_BASE_CALCULO_COBRANCA_ICMS_POR_SUBSTITUICAO_TRIBUTARIA` - 070 - Com redução da Base de Cálculo e cobrança do ICMS por substituição tributária
                  * `OUTRAS` - 090 - Outras
                  * `ICMS_ST` - 060 - ICMS ST
                  * `TRIBUTACAO_MONOFASICA_COMBUSTIVEIS_COBRADA_ANTERIORMENTE` - 061 - Tributação monofásica sobre combustíveis cobrada anteriormente
              examples:
                - TRIBUTADA_INTEGRALMENTE
            csosn:
              type: string
              enum:
                - TRIBUTADA_PELO_SIMPLES_NACIONAL_COM_PERMISSAO_DE_CREDITO
                - TRIBUTADA_PELO_SIMPLES_NACIONAL_SEM_PERMISSAO_DE_CREDITO
                - ISENCAO_DO_ICMS_NO_SIMPLES_NACIONAL_PARA_FAIXA_DE_RECEITA_BRUTA
                - TRIBUTADA_PELO_SIMPLES_NACIONAL_COM_PERMISSAO_DE_CREDITO_E_COM_COBRANCA_DO_ICMS_POR_SUBSTITUICAO_TRIBUTARIA
                - TRIBUTADA_PELO_SIMPLES_NACIONAL_SEM_PERMISSAO_DE_CREDITO_E_COM_COBRANCA_DO_ICMS_POR_SUBSTITUICAO_TRIBUTARIA
                - ISENCAO_DO_ICMS_NOS_SIMPLES_NACIONAL_PARA_FAIXA_DE_RECEITA_BRUTA_E_COM_COBRANCA_DO_ICMS_POR_SUBSTITUICAO_TRIBUTARIA
                - IMUNE
                - NAO_TRIBUTADA_PELO_SIMPLES_NACIONAL
                - ICMS_COBRADO_ANTERIORMENTE_POR_SUBSTITUICAO_TRIBUTARIA_SUBSTITUIDO_OU_POR_ANTECIPACAO
                - OUTROS
              description: |
                CSOSN:
                  * `TRIBUTADA_PELO_SIMPLES_NACIONAL_COM_PERMISSAO_DE_CREDITO` - 101 - Tributada pelo Simples Nacional com permissão de crédito
                  * `TRIBUTADA_PELO_SIMPLES_NACIONAL_SEM_PERMISSAO_DE_CREDITO` - 102 - Tributada pelo Simples Nacional sem permissão de crédito
                  * `ISENCAO_DO_ICMS_NO_SIMPLES_NACIONAL_PARA_FAIXA_DE_RECEITA_BRUTA` - 103 - Isenção do ICMS no Simples Nacional para faixa de receita bruta
                  * `TRIBUTADA_PELO_SIMPLES_NACIONAL_COM_PERMISSAO_DE_CREDITO_E_COM_COBRANCA_DO_ICMS_POR_SUBSTITUICAO_TRIBUTARIA` - 201 - Tributada pelo Simples Nacional com permissão de crédito e com cobrança do ICMS por Substituição Tributária
                  * `TRIBUTADA_PELO_SIMPLES_NACIONAL_SEM_PERMISSAO_DE_CREDITO_E_COM_COBRANCA_DO_ICMS_POR_SUBSTITUICAO_TRIBUTARIA` - 202 - Tributada pelo Simples Nacional sem permissão de crédito e com cobrança do ICMS por Substituição Tributária
                  * `ISENCAO_DO_ICMS_NOS_SIMPLES_NACIONAL_PARA_FAIXA_DE_RECEITA_BRUTA_E_COM_COBRANCA_DO_ICMS_POR_SUBSTITUICAO_TRIBUTARIA` - 203 - Isenção do ICMS nos Simples Nacional para faixa de receita bruta e com cobrança do ICMS por Substituição Tributária
                  * `IMUNE` - 300 - Imune
                  * `NAO_TRIBUTADA_PELO_SIMPLES_NACIONAL` - 400 - Não tributada pelo Simples Nacional
                  * `ICMS_COBRADO_ANTERIORMENTE_POR_SUBSTITUICAO_TRIBUTARIA_SUBSTITUIDO_OU_POR_ANTECIPACAO` - 500 - ICMS cobrado anteriormente por substituição tributária (substituído) ou por antecipação
                  * `OUTROS` - 900 - Outros
              examples:
                - TRIBUTADA_PELO_SIMPLES_NACIONAL_COM_PERMISSAO_DE_CREDITO
    RevBankAccount:
      type: object
      description: Schema que representa uma conta bancária no RevBank
      properties:
        id:
          type: string
          description: Identificador único da conta
          examples:
            - 12345678-9012-3456-7890-1234567890123
        name:
          type: string
          description: Nome empresarial ou nome do titular da conta
          examples:
            - TARTIGRADO TECNOLOGIA LTDA
        marketplace:
          type: boolean
          description: Indica se a conta opera no modelo de marketplace
          examples:
            - false
        balance:
          type: string
          description: Saldo atual da conta formatado em moeda
          examples:
            - 'R$ 10.000,00'
        informations:
          type: array
          description: Lista de informações adicionais da conta em formato chave-valor
          items:
            type: object
            properties:
              key:
                type: string
                description: Identificador da informação
                examples:
                  - cnpj
              value:
                type: string
                description: Valor associado à chave informativa
                examples:
                  - 11.520.224/0001-40
        fines:
          type: boolean
          description: Indica se há configuração de multas por atraso
          examples:
            - true
        configuration:
          type: object
          description: Configurações dos meios de pagamento habilitados na conta
          properties:
            bank_slip:
              type: object
              description: Configurações de pagamento via boleto bancário
              properties:
                active:
                  type: boolean
                  description: Indica se o boleto está habilitado
                  examples:
                    - true
                extra_due:
                  type: string
                  description: Dias adicionais para vencimento do boleto
                  examples:
                    - '30'
                reprint_extra_due:
                  type: string
                  description: Dias adicionais ao reemitir o boleto
                  examples:
                    - '0'
            credit_card:
              type: object
              description: Configurações de pagamento via cartão de crédito
              properties:
                active:
                  type: boolean
                  description: Indica se o cartão de crédito está habilitado
                  examples:
                    - true
                installments:
                  type: boolean
                  description: Indica se o parcelamento é permitido
                  examples:
                    - false
                installments_pass_interest:
                  type: boolean
                  description: Indica se os juros são repassados ao cliente
                  examples:
                    - false
                max_installments:
                  type: string
                  description: Número máximo de parcelas permitido
                  examples:
                    - '0'
                max_installments_without_interest:
                  type: string
                  description: Número máximo de parcelas sem juros
                  examples:
                    - '0'
                two_step_transaction:
                  type: boolean
                  description: Indica se a transação ocorre em duas etapas (autorização e captura)
                  examples:
                    - false
            pix:
              type: object
              description: Configurações de pagamento via PIX
              properties:
                active:
                  type: boolean
                  description: Indica se o PIX está habilitado
                  examples:
                    - true
        commissions:
          type: object
          description: Informações de comissão aplicadas à conta
          properties:
            cents:
              type: integer
              description: Valor da comissão em centavos
              examples:
                - 172
        splits:
          type: array
          description: Regras de divisão de valores (split de pagamento)
          items:
            type: object
            properties:
              id:
                type: string
                description: Identificador da regra de split
                examples:
                  - 12345678-9012-3456-7890-1234567890123
              cents:
                type: integer
                description: Valor destinado ao split em centavos
                examples:
                  - 172
              permit_aggregated:
                type: boolean
                description: Indica se o split pode ser agregado a outros pagamentos
                examples:
                  - false
              recipient_account_id:
                type: string
                description: Identificador da conta recebedora
                examples:
                  - 12345678-9012-3456-7890-1234567890123
        created_at:
          type: string
          description: Data e hora de criação da conta
          format: date-time
          examples:
            - '2022-10-13T14:28:54-03:00'
        updated_at:
          type: string
          description: Data e hora da última atualização da conta
          format: date-time
          examples:
            - '2025-12-15T12:18:22-03:00'
        last_verification_request_status:
          type: string
          description: Status da última solicitação de verificação cadastral
          examples:
            - accepted
        disable_emails:
          type: boolean
          description: Indica se o envio de e-mails está desabilitado para a conta
          examples:
            - false
        last_withdraw:
          type: object
          description: Informações do último saque realizado
          properties:
            id:
              type: string
              description: Identificador do saque
              examples:
                - 12345678-9012-3456-7890-1234567890123
            amount:
              type: number
              description: Valor do saque
              format: double
              examples:
                - 10000
            status:
              type: string
              description: Status do saque
              examples:
                - accepted
            bank:
              type: string
              description: Banco utilizado para o saque
              examples:
                - Bradesco/Next
            reference:
              type: string
              description: Referência única da transação
              examples:
                - 12345678-9012-3456-7890-1234567890123
        reply_to:
          type: string
          description: Endereço de e-mail configurado para recebimento de notificações
          format: email
          examples:
            - falecom@revgas.com
        disabled_withdraw:
          type: boolean
          description: Indica se os saques estão desabilitados para a conta
          examples:
            - false
        contact_data:
          type: object
          description: Dados de contato e endereço do titular da conta
          properties:
            name:
              type: string
              description: Nome do titular ou empresa
              examples:
                - TARTIGRADO TECNOLOGIA LTDA
            document_number:
              type: string
              description: CPF ou CNPJ do titular
              examples:
                - 11520224000140
            full_address:
              type: string
              description: Endereço completo do titular da conta
              examples:
                - Rua Arlindo Nogueira 333 Sala 310 Ed. Luiz Fortes Centro Teresina PI 64000-290
      name: RevBankAccount
