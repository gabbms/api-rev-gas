components:
  parameters:
    page:
      name: page
      in: query
      description: Número da página
      required: false
      schema:
        type: string
        default: '1'
        examples:
          - '1'
    page_size:
      name: page_size
      in: query
      description: Quantidade de itens por página
      required: false
      schema:
        type: string
        default: '10'
        examples:
          - '10'
    from:
      name: from
      in: query
      description: |
        Data inicial de criação do registro (yyyy-mm-dd)
        Por padrão será o primeiro dia do mês atual
      required: false
      schema:
        type: string
        format: date
        examples:
          - '2021-01-01'
    to:
      name: to
      in: query
      description: |
        Data final de criação do registro (yyyy-mm-dd)
        Por padrão será o último dia do mês atual
      required: false
      schema:
        type: string
        format: date
        examples:
          - '2022-01-01'
    establishment_id:
      name: establishment_id
      in: query
      description: Identificador do estabelecimento
      schema:
        type: integer
        examples:
          - 1
    required_establishment_id:
      name: establishment_id
      in: query
      description: Identificador do estabelecimento
      required: true
      schema:
        type: integer
        examples:
          - 1
    establishment_isnull:
      name: establishment_isnull
      in: query
      description: 'Estabelecimento nulo? true: Sim, false: Não'
      required: false
      schema:
        type: boolean
    uf:
      name: uf
      in: query
      description: UF
      schema:
        type: string
        minLength: 2
        maxLength: 2
        examples:
          - SP
    status_active_inactive:
      name: status
      in: query
      description: |
        Status:
          * `ACTIVE` - Ativo
          * `INACTIVE` - Inativo
      schema:
        type: string
        enum:
          - ACTIVE
          - INACTIVE
        examples:
          - ACTIVE
    supplier_id:
      name: supplier_id
      in: query
      description: Identificador do fornecedor
      required: false
      schema:
        type: integer
        examples:
          - 1
    active:
      name: active
      in: query
      description: Ativo?
      required: false
      schema:
        type: boolean
        examples:
          - true
    use_count_gte:
      name: use_count_gte
      in: query
      description: Quantidade de usos maior ou igual a?
      schema:
        type: number
        examples:
          - 1
    use_count_lte:
      name: use_count_lte
      in: query
      description: Quantidade de usos menor ou igual a?
      schema:
        type: number
        examples:
          - 1
    phone:
      name: phone
      in: query
      description: Telefone
      schema:
        type: string
        pattern: '^(((\+)?(5{2})(\d{10,11}))|(\d{10,11}))$'
        examples:
          - '11999998888'
    email:
      name: email
      in: query
      description: E-mail
      schema:
        type: string
        format: email
    cpf:
      name: cpf
      in: query
      description: CPF
      schema:
        type: string
        minLength: 11
        maxLength: 11
    cpf_isnull:
      name: cpf_isnull
      in: query
      description: CPF é nulo?
      schema:
        type: boolean
    name:
      name: name
      in: query
      description: Nome
      schema:
        type: string
    name_or_fantasy_name:
      name: name_or_fantasy_name
      in: query
      description: Nome ou Nome fantasia
      schema:
        type: string
    person_type:
      name: type
      in: query
      description: |
        Tipo de pessoa:
         * `PHYSICAL` - Pessoa Física
         * `JURIDICAL` - Pessoa Jurídica
      schema:
        type: string
        enum:
          - PHYSICAL
          - JURIDICAL
        examples:
          - PHYSICAL
      examples:
        default:
          value: PHYSICAL
    city:
      name: city
      in: query
      description: Cidade
      schema:
        type: string
        examples:
          - São Paulo
      examples:
        default:
          value: São Paulo
    state_federation:
      name: state_federation
      in: query
      description: Estado
      schema:
        type: string
        examples:
          - São Paulo
      examples:
        default:
          value: São Paulo
    location:
      name: location
      in: query
      description: Logradouro
      schema:
        type: string
        examples:
          - Avenida das tulipas
      examples:
        default:
          value: Avenida das tulipas
    location_starts_with:
      name: location_starts_with
      in: query
      description: 'Logradouro iniciando com: '
      schema:
        type: string
        examples:
          - Avenida das tul
      examples:
        default:
          value: Avenida das tul
    neighborhood:
      name: neighborhood
      in: query
      description: Bairro
      schema:
        type: string
        examples:
          - Centro
      examples:
        default:
