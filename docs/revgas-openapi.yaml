    CteConfigurationUpdate:
      type: object
      title: CteConfigurationUpdate
      description: Schema que representa a atualização de uma configuração de CT-e
      properties:
        environment:
          type: string
          enum:
            - PRODUCTION
            - HOMOLOGATION
          description: |
            Ambiente fiscal:
              * `PRODUCTION` - Produção
              * `HOMOLOGATION` - Homologação
          examples:
            - HOMOLOGATION
        cte_emission_type:
          type: string
          enum:
            - NORMAL
            - SVCSP
            - SVCRS
          description: |
            Tipo de emissão:
              * `NORMAL` - Normal
              * `SVCSP` - Contingência SVCSP
              * `SVCRS` - Contingência SVCRS
          examples:
            - NORMAL
        serie_homologation_id:
          type: number
          description: Identificador da série de homologação
          format: int64
          examples:
            - 1
        number_homologation:
          type: number
          description: Número de homologação (CT-e)
          format: int64
          examples:
            - 1
        serie_production_id:
          type: number
          description: Identificador da série de produção
          format: int64
          examples:
            - 1
        number_production:
          type: number
          description: Número de produção (CT-e)
          format: int64
          examples:
            - 1
        use_cte_sqs:
          type: boolean
          description: Utilizar emissão assíncrona?
          examples:
            - true
        activate_status_service:
          type: boolean
          description: Ativar consulta automática do serviço de consulta de status?
          examples:
            - true
        automatic_endorsement:
          type: boolean
          description: Averbar automaticamente o MDF-e?
          examples:
            - true
