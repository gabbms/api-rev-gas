    CteCreate:
      type: object
      title: CteCreate
      description: Schema que representa a emissão de um CT-e
      properties:
        nfes:
          type: array
          description: Lista de chave de acesso da NF-e
          uniqueItems: true
          items:
            type: string
            minLength: 44
            maxLength: 44
            examples:
              - '99999999999999999999999999999999999999999999'
        shipping:
          type: number
          description: Valor do frete
          minimum: 0.01
          examples:
            - 0.01
