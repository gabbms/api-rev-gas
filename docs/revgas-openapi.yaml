                description: CPF do fornecedor
                examples:
                  - 000.000.000-00
              cnpj:
                type: string
                description: CNPJ do fornecedor
                examples:
                  - 00.000.000/0000-00
              state_registration:
                type: string
                description: Inscrição estadual
                examples:
                  - '12345678'
              civil_registration:
                type: string
                description: RG
                examples:
                  - '12345678'
              number:
                type: string
                description: Número do endereço
                examples:
                  - Numero exemplo
              neighborhood:
                type: string
                description: Bairro
                examples:
                  - Bairro exemplo
              complement:
                type: string
                description: Complemento do endereço do fornecedor
                examples:
                  - Complemento exemplo
              landmark:
                type: string
                description: Ponto de referência
                examples:
                  - Ponto de referência
              observation:
                type: string
                description: Observação
                examples:
                  - Observação
              postal_code:
                type: string
                description: Cep do fornecedor
                pattern: '[0-9]{5}-[0-9]{3}'
                examples:
                  - 10000-000
              city:
                type: string
                description: Cidade do fornecedor
                examples:
                  - São Paulo
              latitude:
                type: string
                description: Latitude do endereço
                examples:
                  - '+0.0000'
              longitude:
                type: string
                description: Longitude do endereço
                format: double
                examples:
                  - '+0.0000'
              sex:
                type: string
                enum:
                  - MALE
                  - FEMALE
                description: |
                  Sexo:
                    * `MALE` - Masculino
                    * `FEMALE` - Feminino
                default: MALE
                examples:
                  - MALE
              type:
                type: string
                enum:
                  - PHYSICAL
                  - JURIDICAL
                description: |
                  Tipo de pessoa:
                  * `PHYSICAL` - Pessoa Física
                  * `JURIDICAL` - Pessoa Jurídica
              crt:
                type: string
                enum:
                  - SIMPLES_NACIONAL
                  - SIMPLES_NACIONAL_EXCESSO_RECEITA
                  - NORMAL
                description: |
                  Regime tributário:
                    * `SIMPLES_NACIONAL` - Simples nacional
                    * `SIMPLES_NACIONAL_EXCESSO_RECEITA` - Simples nacional com excesso de sublimite da receita bruta
                    * `NORMAL` - Regime Normal
                default: SIMPLES_NACIONAL
                examples:
                  - SIMPLES_NACIONAL
              birthday:
                type: string
                description: Data de aniversário
                format: date
                examples:
                  - '2002-03-11'
              emails:
                type: array
                description: Lista de emails
                uniqueItems: true
                items:
                  type: string
                  format: email
              phones:
                type: array
                description: Lista de telefones
                items:
                  type: string
                  minLength: 12
                  maxLength: 13
              state_federation:
                type: string
                description: Estado do fornecedor
                examples:
                  - Estado Exemplo
            required:
              - name
              - location
              - number
              - neighborhood
              - city
              - state_federation
    TokenCreate:
      content:
        application/json:
          schema:
            type: object
            oneOf:
              - type: object
                description: Autenticação via Firebase
                properties:
                  id_token:
                    type: string
