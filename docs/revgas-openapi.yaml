      title: NfWebhookEvent
      description: Schema que representa o webhook de evento de MDF-e
      properties:
        cStat:
          type: string
          description: Status da sefaz
          examples:
            - '135'
        xMotivo:
          type: string
          description: Descrição do status da sefaz
          examples:
            - Evento registrado e vinculado a NF-e
        retEvento:
          type: array
          items:
            type: object
            properties:
              infEvento:
                type: object
                description: Informações do evento
                properties:
                  nProt:
                    type: string
                    description: Protocolo de autorização do evento
                    examples:
                      - '922240000000595'
                  cStat:
                    type: string
                    description: Status da sefaz
                    examples:
                      - '135'
                  xMotivo:
                    type: string
                    description: Descrição do status da sefaz
                    examples:
                      - Evento registrado e vinculado a NF-e
                  tpEvento:
                    type: string
                    description: Tipo de evento
                    examples:
                      - '110111'
                  descEvento:
                    type: string
                    description: Descrição do evento
                    examples:
                      - Cancelamento
                  nSeqEvento:
                    type: string
                    description: Número sequencial do evento
                    examples:
                      - '1'
    NfWebhookProcEvent:
      type: object
      title: NfWebhookProcEvent
      description: Schema que representa o webhook de evento processado de NF-e
      properties:
        evento:
          type: object
          description: Dados de envio do evento
          properties:
            infEvento:
              type: object
              description: Informações do evento
              properties:
                tpEvento:
                  type: string
                  description: Tipo de evento
                  examples:
                    - '110111'
                nSeqEvento:
                  type: string
                  description: Número sequencial do evento
                  examples:
                    - '1'
                detEvento:
                  type: object
                  description: Detalhes do evento
                  properties:
                    descEvento:
                      type: string
                      description: Descrição do evento
                      examples:
                        - Cancelamento
                    xJust:
                      type: string
                      description: Justificativa do evento (Caso cancelamento)
                      examples:
                        - Nota emitida incorretamente
                    xCorrecao:
                      type: string
                      description: Correção do evento (Caso carta de correção)
                      examples:
                        - Nota emitida incorretamente
        retEvento:
          type: object
          description: Dados de retorno do evento
          properties:
            infEvento:
              type: object
              description: Informações do evento
              properties:
                nProt:
                  type: string
                  description: Protocolo de autorização do evento
                  examples:
                    - '922240000000595'
                cStat:
                  type: string
                  description: Status da sefaz
                  examples:
                    - '135'
                xMotivo:
                  type: string
                  description: Descrição do status da sefaz
                  examples:
                    - Evento registrado e vinculado a NF-e
                tpEvento:
                  type: string
                  description: Tipo de evento
                  examples:
                    - '110111'
                descEvento:
                  type: string
                  description: Descrição do evento
                  examples:
                    - Cancelamento
                nSeqEvento:
                  type: string
                  description: Número sequencial do evento
                  examples:
                    - '1'
    CreateUpdateOauthApplication:
      type: object
      title: CreateUpdateOauthApplication
      description: Schema que representa a criação/atualização de uma aplicação OAuth
      allOf:
        - type: object
          properties:
            application:
              const: POWER_BI
              description: Aplicação
              examples:
                - POWER_BI
            client_secret:
              type: string
              description: Chave do cliente oauth
              examples:
                - test-secret-id
            client_id:
              type: string
              description: Identificador do cliente oauth
              examples:
                - test-client-id
            tenant_id:
              type: string
              description: Identificador do tenant do cliente Power BI
              examples:
                - test-tenant-id
            scopes:
              type: string
              description: Escopos da aplicação OAuth
              examples:
                - 'https://analysis.windows.net/powerbi/api/.default'
            redirect_uri:
              type: string
              description: Endpoint de redirecionamento OAuth
              examples:
                - 'https://api.revgas.com/v1/oauth/token'
            redirect_client_uri:
              type: string
              description: Endpoint de redirecionamento Oauth do cliente
              examples:
                - 'https://app.revgas.com/#/oauth-client-uri'
    CreateProductCrt:
      type: object
      title: CreateProductCrt
      description: Schema que representa a criação de uma configuração fiscal
      allOf:
        - $ref: '#/components/schemas/UpdateProductCrt'
        - type: object
          properties:
            cfop_id:
              type: number
              description: Identificador do CFOP
              format: int64
            product_id:
              type: number
              description: Identificador do produto
              format: int64
