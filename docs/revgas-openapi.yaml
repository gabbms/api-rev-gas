        payment_form:
          type: string
          description: |
            Forma de pagamento:
            * `DINHEIRO` - Dinheiro
            * `CHEQUE` - Cheque
            * `CARTAO_DE_CREDITO` - Cartão de Crédito
            * `CARTAO_DE_DEBITO` - Cartão de Débito
