    XmlZipCreate:
      description: Corpo de requisição para criar um zip de XMLs
      content:
        application/json:
          schema:
            type: object
            properties:
              year:
                type: number
                description: Ano do arquivo ZIP
                format: int32
                examples:
                  - 2023
              month:
                type: number
                description: Mês do arquivo ZIP
                format: int32
                examples:
                  - 1
              establishment_id:
                type: number
                description: Identificador do estabelecimento
                format: int64
                examples:
                  - 1
              model:
                type: string
                enum:
                  - NFE
                  - NFCE
                  - CTE
                  - MDFE
                description: |
                  Modelo:
                    * `NFE` - NF-e
                    * `NFCE` - NFC-e
                    * `CTE` - CT-e
                    * `MDFE` - MDF-e
                examples:
                  - NFE
