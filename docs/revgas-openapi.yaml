    RecoverPassword:
      description: Corpo da requisição para resetar senha
      content:
        application/json:
          schema:
            type: object
            properties:
              new_password:
                type: string
                description: Nova senha do usuário
                examples:
                  - RevGas12345
              repeat_new_password:
                type: string
                description: Confirmação da nova senha do usuário
                examples:
                  - RevGas12345
    ValeGasCreate:
      description: Corpo da requisição para criar um vale gás
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                description: Itens do vale gás
                items:
                  type: object
                  properties:
                    payment_type:
                      type: string
                      enum:
                        - MONEY
                        - WALLET
                        - BANKDRAFT
                        - FETLOCK
                        - VISA
                        - MASTER
                        - HIPER
                        - CREDISHOP
                        - VALEGAS
                        - ELO
                        - CARTAO_DE_CREDITO
                        - CARTAO_OUTRO
                        - CREDITO_CLIENTE
                        - CARTAO_DE_DEBITO
                        - CARTAO_REVGAS
                        - PIX
                        - TRANSFERENCIA_BANCARIA
                      description: |
                        Forma de pagamento:
                          * `MONEY` - Dinheiro
                          * `WALLET` - Carteira
                          * `BANKDRAFT` - Cheque
                          * `FETLOCK` - Boleto Bancário
                          * `VISA` - Cartão Visa
                          * `MASTER` - Cartão Master
                          * `HIPER` - Cartão Hiper
                          * `CREDISHOP` - Cartão Credishop
                          * `VALEGAS` - Vale Gás
                          * `ELO` - Cartão Elo
                          * `CARTAO_DE_CREDITO` - Cartão de Crédito
                          * `CARTAO_OUTRO` - Cartão Outro
                          * `CREDITO_CLIENTE` - Crédito de Cliente
                          * `CARTAO_DE_DEBITO` - Cartão de Débito
                          * `CARTAO_REVGAS` - Cartão RevGás
                          * `PIX` - PIX
                          * `TRANSFERENCIA_BANCARIA` - Transferência Bancária
                      examples:
                        - MONEY
                    quantity:
                      type: number
                      description: Quantidade de vales
                      format: int32
                      examples:
                        - 50
                    unit_value:
                      type: number
                      description: Valor unitário
                      format: double
                      examples:
                        - 130
                    product_id:
                      type: number
                      description: Identificador do produto
                      format: int64
                      examples:
                        - 1
              establishment_id:
                type: number
                description: Identificador do estabelecimento
                format: int64
                examples:
                  - 1
              customer_id:
                type: number
                description: Identificador do cliente
                format: int64
                examples:
                  - 1
    ChangeEstablishment:
      description: Corpo de requisição para alterar estabelecimento
      content:
        application/json:
          schema:
            type: object
            properties:
              establishment_id:
                type: number
                description: Identificador do estabelecimento
                format: int64
                examples:
