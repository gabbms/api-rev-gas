                  Código da unidade:
                    - `00` - M3;
                    - `01` - KG;
                    - `02` - TON;
                    - `03` - UNIDADE;
                    - `04` - LITROS;
                    - `05` - MMBTU 
                examples:
                  - '00'
              tp_med:
                type: string
                description: Tipo de medida
                examples:
                  - PESO BRUTO
              quantity:
