            - AMERICAN_EXPRESS
            - SOROCRED
            - DINERS_CLUB
            - ELO
            - HIPERCARD
            - AURA
            - CABAL
            - OUTROS
          description: |
            Bandeira de cartão:
              * `VISA` - Visa
              * `MASTERCARD` - Mastercard
              * `AMERICAN_EXPRESS` - American Express
              * `SOROCRED` - Sorocred
              * `DINERS_CLUB` - Diners Club
              * `ELO` - Elo
              * `HIPERCARD` - Hipercard
              * `AURA` - Aura
              * `CABAL` - Cabal
              * `OUTROS` - Outros
