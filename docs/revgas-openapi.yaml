              * `CARTAO_OUTRO` - Cartão Outro
              * `CREDITO_CLIENTE` - Crédito de Cliente
              * `CARTAO_DE_DEBITO` - Cartão de Débito
              * `CARTAO_REVGAS` - Cartão RevGás
              * `PIX` - PIX
