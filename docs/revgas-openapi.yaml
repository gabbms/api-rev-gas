            - Dinheiro em caixa
        to_account_id:
          type: number
          description: Identificador da conta de destino
          format: int64
          examples:
            - 2
        value:
          type: number
          description: Valor da transferência
          format: double
          examples:
            - 100
    AccountantCreateUpdate:
      type: object
      title: AccountantCreateUpdate
      description: Schema para criar ou atualizar uma contabilidade
      allOf:
        - $ref: '#/components/schemas/Person'
        - type: object
          properties:
            default_establishment_id:
              type: number
              description: Estabelecimento padrão da contabilidade
              format: int64
              examples:
                - 1
            establishments:
              type: array
              description: Lista de estabelecimentos que esta contabilidade possui acesso
              examples:
                - - 1
                  - 2
                  - 3
              uniqueItems: true
              items:
                type: number
                format: int64
    Person:
      type: object
      title: Person
      description: Schema que representa uma pessoa
      properties:
        name:
          type: string
          description: Nome da pessoa
          examples:
            - Nome
        nick_name:
          type: string
          description: Apelido da pessoa (Somente pessoas físicas)
          examples:
            - Apelido
        fantasy_name:
          type: string
          description: Nome fantasia do cliente (Somente pessoas jurídicas)
          examples:
            - Nome fantasia
        cpf:
          type: string
          description: CPF da pessoa (Somente pessoas físicas)
          minLength: 11
          maxLength: 11
          examples:
            - '00000000000'
        cnpj:
          type: string
          description: CNPJ da pessoa (Somente pessoas jurídicas)
          examples:
            - '00000000000000'
        civil_registration:
          type: string
          description: RG
          examples:
            - '12345678'
        state_registration:
          type: string
          description: Inscrição estadual
          examples:
            - '12345678'
        location:
          type: string
          description: Logradouro
          examples:
            - Rua exemplo
        number:
          type: string
          description: Número do endereço
          examples:
            - Numero exemplo
        neighborhood:
          type: string
          description: Bairro
          examples:
            - Bairro exemplo
        complement:
          type: string
          description: Complemento do endereço do cliente
          examples:
            - Complemento exemplo
        landmark:
          type: string
          description: Ponto de referência
          examples:
            - Ponto de referência
        postal_code:
          type: string
          description: Cep do cliente
          pattern: '[0-9]{5}[0-9]{3}'
          examples:
            - '10000000'
        city:
          type: string
          description: Cidade do cliente
          examples:
            - Cidade Exemplo
        state_federation:
          type: string
          description: Estado do cliente
          examples:
            - Estado Exemplo
        latitude:
          type: string
          description: Latitude do endereço
          examples:
            - '0.000000'
        longitude:
          type: string
          description: Longitude do endereço
          format: double
          examples:
            - '0.000000'
        sex:
          type: string
          enum:
            - MALE
            - FEMALE
          description: |
            Sexo:
              * `MALE` - Masculino
              * `FEMALE` - Feminino
        type:
          type: string
          enum:
            - PHYSICAL
            - JURIDICAL
          description: |
            Tipo de pessoa:
            * `PHYSICAL` - Pessoa Física
            * `JURIDICAL` - Pessoa Jurídica
        crt:
          type: string
          enum:
            - SIMPLES_NACIONAL
            - SIMPLES_NACIONAL_EXCESSO_RECEITA
            - NORMAL
          description: |
            Regime tributário da pessoa:
              * `SIMPLES_NACIONAL` - Simples nacional
              * `SIMPLES_NACIONAL_EXCESSO_RECEITA` - Simples nacional com excesso de sublimite da receita bruta
              * `NORMAL` - Regime Normal
        birthday:
          type: string
          description: Data de aniversário
          format: date
          examples:
            - '2002-03-11'
        rntrc:
          type: string
          description: RNTRC da pessoa (Somente transportadores de carga)
          minLength: 8
          maxLength: 8
          examples:
            - '12345678'
        crc:
          type: string
          description: CRC da pessoa (Somente contadores)
          examples:
            - CRC1234
        emails:
          type: array
          description: Lista de emails
          uniqueItems: true
          items:
            type: string
            format: email
        phones:
          type: array
          description: Lista de telefones
          examples:
            - - '551198888888'
          uniqueItems: true
          items:
            type: string
            minLength: 12
            maxLength: 13
    BankCreateUpdate:
