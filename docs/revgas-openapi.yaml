          type: string
          description: Produto predominante (Produto com mais alto valor nas notas fiscais)
          examples:
            - VASILHAME 13KG
        total_nfes:
          type: string
          description: Valor total das notas fiscais
          format: decimal
          examples:
            - '0.01'
        endorsed_quantity:
          type: string
          description: Valor total averbado
          format: decimal
          examples:
            - '0.01'
        percent_reduction:
          type: string
          description: Percentual de redução da base de cálculo do ICMS
          format: decimal
          examples:
            - '0.00'
        service_taker:
          type: string
          enum:
            - EMITTER
            - DISPATCHER
            - RECEIVER
            - REMITTEE
          description: |
            Tomador do serviço:
              - `EMITTER` - Emitente
              - `DISPATCHER` - Expedidor
              - `RECEIVER` - Recebedor
              - `REMITTEE` - Remetente
          examples:
            - EMITTER
