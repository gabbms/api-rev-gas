  /revbank/invoices:
    get:
      tags:
        - RevBank
      summary: Faturas - Listagem
      description: Listar faturas emitidas
      operationId: getRevBankInvoices
      parameters:
        - $ref: '#/components/parameters/required_establishment_id'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/page_size'
        - name: created_at_from
          in: query
          description: Intervalo inicial (Data de criação)
          schema:
            type: string
            format: date-time
        - name: created_at_to
          in: query
          description: Intervalo final (Data de criação)
          schema:
            type: string
            format: date-time
        - name: paid_at_from
          in: query
          description: Intervalo inicial (Data de pagamento)
          schema:
            type: string
            format: date-time
        - name: paid_at_to
          in: query
          description: Intervalo final (Data de pagamento)
          schema:
            type: string
            format: date-time
        - name: updated_since
          in: query
          description: Atualizado a partir de
          schema:
            type: string
            format: date-time
        - name: due_date
          in: query
          description: Data de vencimento
          schema:
            type: string
            format: date
        - name: query
          in: query
          description: Campo de busca dinâmico
          schema:
            type: string
            format: date
        - name: customer_id
          in: query
          description: Identificador do cliente
          schema:
            type: string
            format: date
        - name: status_filter
          in: query
          description: |
            Status da fatura:
             * `pending` - Fatura ainda não paga.
             * `paid` - PIX realizado, boleto compensado ou transação de cartão capturada.
             * `canceled` - Fatura cancelada e impossibilitada de pagamento, podendo ter sido cancelada manualmente ou via API.
             * `in_analysis` - Primeira etapa do recurso de cobrança em duas etapas (Two-Step Billing).
             * `draft` - Fatura ainda não gerada, apenas os dados foram salvos.
             * `partially_paid` - Apenas parte do valor da fatura foi paga.
             * `refunded` - O pagador teve o valor reembolsado.
             * `expired` - Fatura venceu e expirou após ultrapassar o limite de pagamento, exigindo reemissão.
             * `in_protest` - Fatura paga, mas com notificação de compra não reconhecida (apenas cartão de crédito).
             * `chargeback` - Disputa de chargeback ganha pelo pagador, impossibilitando recurso.
             * `externally_paid` - Fatura paga externamente e/ou por outros meios fora da plataforma.
          schema:
            type: string
            enum:
              - pending
              - paid
              - canceled
              - in_analysis
              - draft
              - partially_paid
              - refunded
              - expired
              - in_protest
              - chargeback
              - externally_paid
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RevBankInvoice'
                  pagination:
                    type: object
                    allOf:
                      - $ref: '#/components/schemas/Pagination'
      security:
        - RevgasApiKey: []
      servers:
        - url: 'https://api.revgas.com/v1'
          description: Produção
        - url: 'https://apihomologacao.revgas.com/v1'
          description: Homologação (Não utilizar)
