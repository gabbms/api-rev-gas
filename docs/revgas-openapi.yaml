    CreateProductGrid:
      type: object
      title: CreateProductGrid
      description: Schema que representa a criação de um produto
      properties:
        revgas_product_id:
          type: number
          description: Identificador do produto da RevGás
          format: int64
          examples:
            - 1
        establishment_id:
          type: number
          description: Identificador do estabelecimento
          format: int64
          examples:
            - 1
        initial_stock:
          type: integer
          description: Valor inicial da quantidade em estoque do produto
          default: 0
          examples:
            - 100
        with_container:
          type: boolean
          description: |
            Atenção: Este parâmetro só é válido para produtos que possuem vasilhame
            `true`: Cria um vasilhame associado ao produto
            `false` NÃO cria um vasilhame
          default: true
          examples:
            - true
        unified_container:
          type: boolean
          description: |
            Atenção: Este parâmetro só é válido para produtos que possuem vasilhame
            `true`: Utilizará um vasilhame pré-existente, ou irá criar um vasilhame novo caso não exista
            `false` Irá criar um vasilhame específico para o produto
          default: false
          examples:
            - false
        deals:
          type: array
          description: Lista de acordos
          examples:
            - - 1
          items:
            type: object
            allOf:
              - $ref: '#/components/schemas/WithPaymentType'
              - type: object
                properties:
                  minimum_value:
                    type: string
                    description: Valor mínimo deste acordo
                    format: decimal
                    examples:
                      - '0.01'
                  suggested_value:
                    type: string
                    description: Valor sugerido deste acordo
                    format: decimal
                    examples:
                      - '0.01'
                  term:
                    type: number
                    description: Prazo máxmimo em dias para criação de contas a receber
                    format: int32
                    examples:
                      - 60
                  preferential_term:
                    type: number
                    description: Prazo padrão em dias para criação de contas a receber (Não pode ser maior do que term)
                    format: int32
                    examples:
                      - 30
        variation_options:
          type: array
          description: Lista de variações
          items:
            type: object
            properties:
              description:
                type: string
                description: Descrição da variação
                examples:
                  - Nacional Gás
              short_description:
                type: string
                description: Descrição curta da variação
                examples:
                  - Nacional
              type:
                type: string
                enum:
                  - MARCA
                  - FARDO
                  - VOLUME
                  - TIPO
                description: Tipo de variação
                examples:
                  - MARCA
              quantity:
                type: string
                description: |
                  Este campo só deve ser enviado para variações do tipo "Volume" e se refere a quantidade na unidade padrão (Litros)
                  Por exemplo, uma água 300ML a quantidade em litros é 0.3
                  Serão aplicados cálculos automáticos de peso na emissão de NF-e para os produtos que possuem variações com quantidades informadas
                format: decimal
    CreateProductGrid_2:
      type: object
      title: CreateProductGrid
      description: Schema que representa a atualização de um produto
      properties:
        deals:
          type: array
          description: Lista de acordos
          items:
            type: object
            allOf:
              - $ref: '#/components/schemas/WithPaymentType'
              - type: object
                properties:
                  id:
                    type: number
                    description: Identificador do acordo
                    format: int64
                    examples:
                      - 1
                  _destroy:
                    type: boolean
                    description: |
                      Flag para excluir o acordo:
                      `true`: Irá excluir o acordo, é obrigatório informar o identificador
                      `false`: Não irá excluir o acordo
                    default: false
                    examples:
                      - true
                  minimum_value:
                    type: string
                    description: Valor mínimo deste acordo
                    format: decimal
                    examples:
                      - '0.01'
                  suggested_value:
                    type: string
                    description: Valor sugerido deste acordo
                    format: decimal
                    examples:
                      - '0.01'
                  term:
                    type: number
                    description: Prazo máxmimo em dias para criação de contas a receber
                    format: int32
                    examples:
                      - 60
                  preferential_term:
                    type: number
                    description: Prazo padrão em dias para criação de contas a receber (Não pode ser maior do que term)
                    format: int32
                    examples:
                      - 30
        variation_options:
          type: array
          description: Lista de variações
          items:
            type: object
            properties:
              id:
                type: number
                description: Identificador da variação
                format: int64
                examples:
                  - 1
              _destroy:
                type: boolean
                description: |
                  Flag para excluir a variação:
                  `true`: Irá excluir a variação, é obrigatório informar o identificador
                  `false`: Não irá excluir a variação
                default: false
                examples:
                  - true
              description:
                type: string
                description: Descrição da variação
                examples:
                  - Nacional Gás
              short_description:
                type: string
                description: Descrição curta da variação
                examples:
                  - Nacional
              type:
                type: string
                enum:
                  - MARCA
                  - FARDO
                  - VOLUME
                  - TIPO
                description: Tipo de variação.
                examples:
                  - MARCA
              quantity:
                type: string
                description: |
                  Este campo só deve ser enviado para variações do tipo "Volume" e se refere a quantidade na unidade padrão (Litros)
                  Por exemplo, uma água 300ML a quantidade em litros é 0.3
                  Serão aplicados cálculos automáticos de peso na emissão de NF-e para os produtos que possuem variações com quantidades informadas
                format: decimal
    PaymentCreate:
      type: object
      title: PaymentCreate
      description: Schema para criar um pagamento
      allOf:
        - $ref: '#/components/schemas/PaymentUpdate'
        - type: object
          properties:
            establishment_id:
              type: number
              description: Identificador do estabelecimento
              format: int64
              examples:
                - 1
            competence:
              type: string
              description: Data de competência
              format: date
              examples:
                - '2025-01-01'
            account_id:
              type: number
              description: Identificador da conta
              format: int64
              examples:
                - 1
            value:
              type: number
              description: Valor do pagamento
              format: double
              multipleOf: 0.01
              examples:
                - 125.5
              min: 0.01
            mulct:
              type: number
              description: Multa do pagamento
              format: double
              multipleOf: 0.01
              examples:
                - 0
              min: 0.01
            interest:
              type: number
              description: Juros do pagamento
              format: double
              multipleOf: 0.01
              examples:
                - 0
              min: 0.01
            discount:
              type: number
              description: Desconto do pagamento
              format: double
              multipleOf: 0.01
              examples:
                - 0
              min: 0.01
            description:
              type: string
              description: Descrição do pagamento
              examples:
                - Referente à compra
            customer_id:
              type: number
              description: Identificador do cliente
              format: int64
              examples:
                - 1
            supplier_id:
              type: number
              description: Identificador do fornecedor
              format: int64
              examples:
                - 1
            collaborator_id:
              type: number
              description: Identificador do colaborado
              format: int64
              examples:
                - 1
            category_id:
              type: number
              description: Identificador da subcategoria
              format: int64
              examples:
                - 1
            sub_category_id:
              type: number
              description: Identificador da subcategoria
              format: int64
              examples:
                - 1
          required:
            - establishment_id
            - account_id
            - value
    PaymentUpdate:
